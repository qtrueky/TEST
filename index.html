<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自訂位置迷因產生器</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="config.js"></script>

    <style>
        body { font-family: 'PingFang TC', sans-serif; text-align: center; padding: 20px; background-color: #f4f5f6; margin: 0; }
        h2 { color: #333; margin-bottom: 10px; font-size: 22px; }
        
        .gallery { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; }
        .meme-item { background: white; padding: 10px; border-radius: 10px; width: 140px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .meme-item:active { transform: scale(0.95); }
        .meme-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
        
        /* 編輯器面板 */
        #editor { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .editor-card { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 380px; text-align: left; }
        
        /* 💡 預覽區塊：正方形 1:1，加上透明棋盤格底色證明去背 */
        .preview-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-image: 
                linear-gradient(45deg, #ddd 25%, transparent 25%), 
                linear-gradient(135deg, #ddd 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ddd 75%), 
                linear-gradient(135deg, transparent 75%, #ddd 75%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            touch-action: none; /* 防止在預覽區滑動時滾動網頁 */
        }
        
        .preview-container img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        /* 💡 可拖曳的文字方塊 */
        #draggableText {
            position: absolute;
            top: 75%; /* 預設位置 */
            left: 10%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 5px 10px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: grab;
            user-select: none;
            max-width: 80%;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #draggableText:active { cursor: grabbing; }
        
        label { font-size: 14px; font-weight: bold; color: #555; display: block; margin-top: 10px; }
        input[type="text"] { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        
        .btn-group { display: flex; gap: 8px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px 5px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-cancel { background: #e0e0e0; color: #333; }
        .btn-send-direct { background: #06C755; color: white; display: none; }
        .btn-share-picker { background: #4A90E2; color: white; }
    </style>
</head>
<body>

    <h2>🔥 動態拖曳迷因產生器</h2>
    <div id="loading" style="color:#666; margin-top: 20px;">LIFF 初始化中...</div>
    <div id="gallery" class="gallery"></div>

    <div id="editor">
        <div class="editor-card">
            <!-- 即時預覽區塊 -->
            <div class="preview-container" id="previewBox">
                <img id="previewImg" src="" alt="預覽">
                <div id="draggableText">你的文字會在這裡...</div>
            </div>
            
            <label>輸入自訂文字 (上方預覽可自由拖曳定位)：</label>
            <input type="text" id="customText" placeholder="輸入文字並試著拖曳上方框框...">
            
            <div class="btn-group">
                <button class="btn btn-cancel" onclick="closeEditor()">取消</button>
                <button class="btn btn-send-direct" id="btnSendDirect">直接傳這裡</button>
                <button class="btn btn-share-picker" id="btnSharePicker">轉傳別人</button>
            </div>
        </div>
    </div>

    <script>
        let currentSelectedImageUrl = "";
        
        // 儲存拖曳後的相對百分比位置
        let positionPercent = { top: "75%", left: "10%" };

        async function initializeLiff() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) { liff.login(); return; }
                document.getElementById('loading').style.display = 'none';
                renderGallery();
            } catch (err) {
                document.getElementById('loading').innerHTML = `<span style="color:red;">初始化失敗：${err.message}</span>`;
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            const baseUrl = window.location.origin + "/images/"; 

            memeList.forEach(meme => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'meme-item';
                itemDiv.innerHTML = `<img src="./images/${meme.fileName}" class="meme-img">`;
                itemDiv.addEventListener('click', () => openEditor(baseUrl + meme.fileName, "./images/" + meme.fileName));
                gallery.appendChild(itemDiv);
            });
        }

        function openEditor(absolutePath, relativePath) {
            currentSelectedImageUrl = absolutePath;
            document.getElementById('previewImg').src = relativePath;
            
            // 重置預覽文字與位置
            const textInput = document.getElementById('customText');
            const dragItem = document.getElementById('draggableText');
            textInput.value = ""; 
            dragItem.innerText = "這裡輸入文字...";
            dragItem.style.top = "75%";
            dragItem.style.left = "10%";
            positionPercent = { top: "75%", left: "10%" };

            if (liff.getContext() && liff.getContext().type !== "none") {
                document.getElementById('btnSendDirect').style.display = 'block';
            } else {
                document.getElementById('btnSendDirect').style.display = 'none';
            }

            document.getElementById('editor').style.display = 'flex';
        }

        function closeEditor() {
            document.getElementById('editor').style.display = 'none';
        }

        // 💡 即時同步輸入文字到預覽框
        document.getElementById('customText').addEventListener('input', (e) => {
            const dragItem = document.getElementById('draggableText');
            dragItem.innerText = e.target.value.trim() === "" ? " " : e.target.value;
        });

        // 💡 拖曳引擎實作 (支援手機觸控與電腦滑鼠)
        const dragItem = document.getElementById('draggableText');
        const container = document.getElementById('previewBox');
        let isDragging = false, startX, startY, initialLeft, initialTop;

        function startDrag(e) {
            if (e.target !== dragItem) return;
            isDragging = true;
            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            startX = clientX;
            startY = clientY;
            initialLeft = dragItem.offsetLeft;
            initialTop = dragItem.offsetTop;
            e.preventDefault(); 
        }

        function doDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            let clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            let newLeft = initialLeft + (clientX - startX);
            let newTop = initialTop + (clientY - startY);

            // 邊界限制 (不讓字跑出框外)
            const maxLeft = container.clientWidth - dragItem.clientWidth;
            const maxTop = container.clientHeight - dragItem.clientHeight;
            newLeft = Math.max(0, Math.min(newLeft, maxLeft));
            newTop = Math.max(0, Math.min(newTop, maxTop));

            dragItem.style.left = newLeft + 'px';
            dragItem.style.top = newTop + 'px';

            // 換算成百分比給 LINE Flex Message 使用
            positionPercent.left = ((newLeft / container.clientWidth) * 100).toFixed(1) + '%';
            positionPercent.top = ((newTop / container.clientHeight) * 100).toFixed(1) + '%';
        }

        function stopDrag() { isDragging = false; }

        container.addEventListener('mousedown', startDrag);
        container.addEventListener('mousemove', doDrag);
        window.addEventListener('mouseup', stopDrag);
        container.addEventListener('touchstart', startDrag, {passive: false});
        container.addEventListener('touchmove', doDrag, {passive: false});
        window.addEventListener('touchend', stopDrag);


        // 核心排版引擎：組合 Flex Message，並使用 absolute 定位
        function buildFlexMessage(imageUrl, textValue) {
            return {
                type: "flex",
                altText: "傳送了一張迷因貼圖！",
                contents: {
                    type: "bubble",
                    size: "mega",
                    styles: {
                        body: { backgroundColor: "#00000000" } // 泡泡底強制完全透明
                    },
                    body: {
                        type: "box",
                        layout: "vertical",
                        paddingAll: "0px",
                        contents: [
                            { 
                                type: "image", 
                                url: imageUrl, 
                                size: "full", 
                                aspectMode: "fit", 
                                aspectRatio: "1:1",
                                backgroundColor: "#00000000" // 圖片底色強制透明
                            },
                            { 
                                type: "box", 
                                layout: "vertical",
                                position: "absolute",       // 啟動絕對定位！
                                offsetTop: positionPercent.top,   // 帶入剛剛拖曳算出的 Y 軸 % 數
                                offsetStart: positionPercent.left, // 帶入剛剛拖曳算出的 X 軸 % 數
                                backgroundColor: "#FFFFFFE6", 
                                cornerRadius: "md",
                                paddingAll: "sm",
                                contents: [
                                    { type: "text", text: textValue || " ", weight: "bold", size: "md", color: "#000000", wrap: true }
                                ]
                            }
                        ]
                    }
                }
            };
        }

        // 發送按鈕事件綁定
        document.getElementById('btnSendDirect').addEventListener('click', async () => {
            const flexMsg = buildFlexMessage(currentSelectedImageUrl, document.getElementById('customText').value);
            try {
                await liff.sendMessages([flexMsg]);
                liff.closeWindow(); 
            } catch (err) { alert("發送失敗！"); }
        });

        document.getElementById('btnSharePicker').addEventListener('click', async () => {
            const flexMsg = buildFlexMessage(currentSelectedImageUrl, document.getElementById('customText').value);
            try {
                const result = await liff.shareTargetPicker([flexMsg]);
                if (result) liff.closeWindow();
            } catch (err) { /* 使用者取消轉傳 */ }
        });

        initializeLiff();
    </script>
</body>
</html>
